name: Build IN-island APK

# IN-island — by incertus © 2026

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project zip (if uploaded as zip)
        run: |
          z=$(find . -maxdepth 2 -iname "*.zip" -not -path "./.git/*" | head -n1)
          if [ -n "$z" ]; then
            echo "Found zip: $z"
            mkdir -p _src
            unzip -q -o "$z" -d _src
          fi

      - name: Locate Gradle project
        id: proj
        run: |
          f=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n1)
          if [ -z "$f" ]; then
            echo "::error::settings.gradle.kts not found. Upload the app files to the repo first."
            ls -R | head -60
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: cp app/build/outputs/apk/release/app-release.apk IN-island.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IN-island-APK
          path: ${{ steps.proj.outputs.dir }}/IN-island.apk
          if-no-files-found: error
